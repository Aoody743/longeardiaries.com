# Cloudflare Worker backend for LongEar Diaries.
# The static site itself is served by GitHub Pages; this worker is attached
# to the /api/* and /uploads/* routes of the site domain so the editorial
# office runs same-origin (cookies, no CORS).

name = "longear-backend"
main = "worker/main.js"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "longeardiaries.com/api/*", zone_name = "longeardiaries.com" },
  { pattern = "longeardiaries.com/uploads/*", zone_name = "longeardiaries.com" },
  { pattern = "www.longeardiaries.com/api/*", zone_name = "longeardiaries.com" },
  { pattern = "www.longeardiaries.com/uploads/*", zone_name = "longeardiaries.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "longear-db"
database_id = "385ed5ba-a7ba-4d43-ba01-b9348e9997ad"

[[kv_namespaces]]
binding = "UPLOADS"
id = "791df824c59e414b94be03b70059c52b"
